<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Card</title>
  <link rel="stylesheet" href="css/master.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="card-header">
    <img id = "logoID" src="img/logo.png" alt="Logo">
    <p id = "sloganID">My slogan</p>
  </header>

  <main class="page">
      <img id = "profilePhotoID" src="img/profile.jpg" alt="Profile Photo">
      <span class = "bio">Kassym</span>
      <span class = "bio">SAT Tutor</span>
      <p class="bio">
        Get prepapred for the SAT with me
      </p>

      <div class="socialMedia">
        <a href="https://www.tiktok.com/@douublecheck?lang=ru-RU" ><img src="img/tiktokLogo.png" alt="Telegram"></a>
        <a href="https://www.instagram.com/abylkassymov_/"><img src="img/instaLogo.jfif" alt="Instagram"></a>
      </div>

      <div class="contacts">
        <a class = "contactButtons">
          <img class = "LogoID" src="img/telegramLogo.png" alt="">
          <span class = "buttonText">Telegram</span>
        </a>
        <a class = "contactButtons">
          <img class = "LogoID" src="img/whatsAppLogo.jfif" alt="">
          <span class = "buttonText">WhatsApp</span>
        </a>
      </div>
  </main>

  <footer class="footer">
    <div class="buttonDownload"><span class = "buttonText">Сохранить контакт</span></div>
  </footer>

</body>
</html>
